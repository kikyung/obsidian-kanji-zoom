name: Release

# Push a tag that matches manifest.json "version" (e.g. 0.1.0, no "v" prefix)
on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # create the release
  id-token: write      # sign build provenance attestations
  attestations: write  # store them on GitHub

# One release run per tag at a time (re-pushing a tag never races itself)
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != manifest version $VERSION"; exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Builds main.js; fails on any compatibility issue, test failure or leftover placeholder
      - name: Build + release checks
        run: python3 tools/check.py --release

      # Signed proof that these files were built by this workflow from this commit
      # (shown as "artifact attestations" on GitHub and checked by the community directory)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Re-pushing a tag must not create duplicate releases:
      #   published release exists -> leave it untouched (never change a public release automatically)
      #   draft release(s) exist    -> replace them with one fresh draft
      #   nothing exists            -> create the draft
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | {id, draft}" | jq -s .)

          if [ "$(echo "$RELEASES" | jq '[.[] | select(.draft == false)] | length')" -gt 0 ]; then
            echo "::notice::Release ${TAG} is already published — leaving it unchanged."
            exit 0
          fi

          for id in $(echo "$RELEASES" | jq -r '.[] | select(.draft == true) | .id'); do
            echo "Replacing existing draft release ${id} for ${TAG}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

          # Release notes: list of merged PRs since the previous release
          gh release create "${TAG}" \
            --title "${TAG}" \
            --draft \
            --verify-tag \
            --generate-notes \
            main.js manifest.json styles.css
